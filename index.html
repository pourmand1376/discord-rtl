<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTL Prefix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            background-color: #fff;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: 'Tahoma', sans-serif;
            font-size: 16px;
            resize: vertical;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #0070F3;
            color: white;
            border: none;
            border-radius: 5px;
            font-family: 'Tahoma', sans-serif;
            font-size: 16px;
            cursor: pointer;
        }
        
        .message {
            margin-top: 10px;
            padding: 10px;
            text-align: center;
            background-color: #4BB543;
            color: white;
            border-radius: 5px;
            display: none;
        }
        .description {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 5px;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .description a {
            color: #0070F3;
            text-decoration: none;
        }
        
        .description a:hover {
            text-decoration: underline;
        }
        
    </style>
</head>
<body>
    <div class="description">
        این یک صفحه بسیار ساده است که 
        <a href="https://unicode-explorer.com/c/202B" target="_blank">کاراکتر راست به چپ (U+202B)</a>
         رو به صورت هوشمند در ابتدای هر خط اضافه می‌کنه. از markdown پشتیبانی می‌کنه و سینتکس markdown رو خراب نمی‌کنه. مستقیم داخل دیسکورد کپی کنید و دیگه متن‌تون همه جا به خوبی نمایش داده بشه. به همین سادگی
    </div>
    <textarea id="input-text" placeholder="متن خود را در اینجا قرار دهید..."></textarea>
    <button onclick="copyWithRTL()">کپی متن راست به چپ!</button>
    <div id="message" class="message">کپی شد!</div>
    


    <script>
        function copyWithRTL() {
            const inputText = document.getElementById('input-text').value;
            
            if (!inputText) {
                return;
            }
            
            // Process the text - add RTL EMBEDDING (U+202B) intelligently to preserve markdown syntax
            const lines = inputText.split('\n');
            const processedLines = lines.map(line => {
                // Skip empty lines
                if (line.trim() === '') {
                    return line;
                }
                
                // Check for horizontal rules (they don't need RTL as they're just visual separators)
                if (/^(\s*)([-*_]{3,})(\s*)$/.test(line)) {
                    return line;
                }
                
                // Check for code block delimiters (``` lines) - don't add RTL to opening/closing ```
                if (/^(\s*)```/.test(line)) {
                    return line;
                }
                
                // Markdown patterns where RTL should come after the syntax
                const markdownPatterns = [
                    { regex: /^(\s*)(#{1,6}\s+)/, name: 'header' },           // Headers: # ## ###
                    { regex: /^(\s*)(>\s+)/, name: 'blockquote' },            // Blockquote: >
                    { regex: /^(\s*)([-*+]\s+)/, name: 'unordered-list' },    // Unordered list: - * +
                    { regex: /^(\s*)(\d+\.\s+)/, name: 'ordered-list' },      // Ordered list: 1. 2. 3.
                ];
                
                // Check if line starts with markdown syntax
                for (const pattern of markdownPatterns) {
                    const match = line.match(pattern.regex);
                    if (match) {
                        // Add RTL after markdown syntax
                        const prefix = match[0];
                        const rest = line.substring(prefix.length);
                        return prefix + '\u202B' + rest;
                    }
                }
                
                // For lines without block-level markdown, add RTL at the beginning
                return '\u202B' + line;
            });
            const outputText = processedLines.join('\n');
            
            // Copy directly to clipboard without showing in UI
            const tempTextarea = document.createElement('textarea');
            tempTextarea.value = outputText;
            document.body.appendChild(tempTextarea);
            tempTextarea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextarea);
            
            // Show copied message
            const message = document.getElementById('message');
            message.style.display = 'block';
            setTimeout(() => {
                message.style.display = 'none';
            }, 2000);
        }
    </script>
</body>
</html>
